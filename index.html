<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عجلة السحب العشوائي - الفاروق (تصميم نهائي)</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎡</text></svg>">
</head>
<body>
    <div id="app-container">

        <!-- قسم التحكم الآن على اليسار في الشاشات الكبيرة -->
        <section class="controls-section">
             <div class="logo-placeholder">♥ SPIN_الفَارُوق ♥</div>

             <div id="winnerDisplay" class="hidden">
                <p>الفائز هو:</p>
                <p id="winnerName"></p>
            </div>
            <button id="spinButton" aria-label="دور العجلة">دور!</button>
             <p id="participantInfo">أضف مشاركين لتبدأ</p>

            <div class="participant-manager">
                <h2>المشاركون (<span id="entriesCount">0</span>)</h2>
                 <div class="input-area">
                    <input type="text" id="participantInput" placeholder="أدخل اسم مشارك..." aria-label="أدخل اسم مشارك">
                    <button id="addButton" aria-label="إضافة مشارك">أضف</button>
                </div>
                <!-- استخدام div للقائمة -->
                <div id="participantList" class="participant-list-area">
                    <!-- سيتم ملء القائمة بواسطة JavaScript -->
                </div>
                <button id="clearButton" class="danger" aria-label="مسح كل المشاركين">مسح الكل</button>
            </div>
        </section>

        <!-- قسم العجلة الآن على اليمين في الشاشات الكبيرة -->
        <section class="wheel-section">
            <div id="wheelOuterContainer">
                <div id="wheelContainer">
                    <canvas id="wheelCanvas"></canvas>
                    <!-- الدائرة المركزية بتصميم wheelofnames -->
                    <div id="wheelCenterDecoration"></div>
                </div>
                 <!-- المؤشر الرمادي -->
                <div id="pointer"></div>
            </div>
        </section>

    </div><!-- نهاية app-container -->

    <footer>
                                     
               ───╤ ̵̵͇̿̿̿̿╦︻з=
        ت̀́ص̀́آ̀́م̀́ي̀́م̀́ ۈ̀́ب̀́ر̀́م̀́ج̀́ة (آ̀́ل̀́ف̀́آ̀́ر̀́ۈ̀́ق̀́)                            

    </footer>

    <!-- عناصر الصوت - تأكد من وجود ملفات tick.mp3 و win.mp3 في نفس المجلد -->
    <audio id="tickSound" src="tick.mp3" preload="auto"></audio>
    <audio id="winSound" src="win.mp3" preload="auto"></audio>

    <script src="script.js" defer></script>
</body>
</html>
